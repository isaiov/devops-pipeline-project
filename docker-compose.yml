services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-pipeline-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
