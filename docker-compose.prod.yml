services:
  web:
    image: ghcr.io/${GITHUB_REPO:-isaiov/devops-pipeline-project}:latest
    container_name: devops-pipeline-web
    ports:
      - "80:80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
